server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/orders/**
        - id: dispatch-service
          uri: ${DISPATCH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/dispatch/**
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/tracking/**,/api/notifications/**

jwt:
  secret: ${JWT_SECRET:SpxDeliverySystemSecretKeyForMicroservices2026PTITNhom24MustBeLongEnough256Bits}

management:
  endpoints:
    web:
      exposure:
        include: health,info
